<!--
  Supabase → Authentication → Email Templates → Magic Link
  Subject: Your Cycle Found sign-in code
  Paste the body below (everything inside the outermost table is fine too).
  Requires {{ .Token }} so Community email OTP shows a 6-digit code.
-->
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="100%"
  style="margin:0;padding:0;background-color:#f8f7f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;"
>
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="100%"
        style="max-width:520px;background-color:#ffffff;border:1px solid #e5e5df;border-radius:14px;"
      >
        <tr>
          <td align="center" style="padding:28px 28px 8px;">
            <img
              src="https://cyclefound.com/email/cycle-found-logo.png"
              alt="Cycle Found — Ask · Share · Ride"
              width="280"
              style="display:block;width:280px;max-width:100%;height:auto;border:0;"
            />
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 8px;color:#10171b;font-size:20px;font-weight:700;line-height:1.3;text-align:center;">
            Your sign-in code
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 8px;color:#525651;font-size:15px;line-height:1.5;text-align:center;">
            Enter this code on the Cycle Found sign-in page. It expires shortly and can only be used once.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:16px 28px 8px;">
            <div
              style="display:inline-block;padding:14px 22px;border-radius:10px;background-color:#eef3e8;border:1px solid #c5d6b5;color:#10171b;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:0.28em;"
            >
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 28px 28px;color:#737772;font-size:13px;line-height:1.5;text-align:center;">
            Or
            <a href="{{ .ConfirmationURL }}" style="color:#527d31;font-weight:600;text-decoration:underline;">
              sign in with this link
            </a>
            instead.<br />
            If you didn’t request this, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
